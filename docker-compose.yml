version: '3.8'

services:
  monsooniq:
    build: .
    container_name: monsooniq_app
    ports:
      - "8000:8000"
    environment:
      # synthetic = committed benchmark; real = data/real/ built by `make real-data real`
      - MONSOONIQ_PROFILE=${MONSOONIQ_PROFILE:-synthetic}
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    restart: unless-stopped
