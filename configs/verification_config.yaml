# MonsoonIQ Verification Configuration

thresholds:
  light: 2.5
  moderate: 15.6
  heavy: 64.5
  very_heavy: 115.6
  extremely_heavy: 204.5

units: "mm/day"

neighborhood_scales:
  - 1  # Point-scale (single grid cell ~27 km)
  - 3  # 3x3 cells (~80 km scale)
  - 5  # 5x5 cells (~135 km scale)
  - 9  # 9x9 cells (~240 km scale)

baselines:
  - id: "raw_nwp"
    name: "Raw NWP Forecast"
    description: "Uncorrected numerical weather prediction rainfall forecast"
  - id: "global_qm"
    name: "Global Quantile Mapping"
    description: "Standard single empirical quantile mapping applied globally without regime conditioning"
  - id: "global_lgb"
    name: "Global LightGBM"
    description: "Single global gradient-boosted tree model trained across all regimes"
  - id: "monsooniq"
    name: "MonsoonIQ (Regime-Aware MoE)"
    description: "Regime-Aware Mixture-of-Experts with calibrated soft blending and residual learning"

metrics:
  continuous:
    - "rmse"
    - "mae"
    - "bias"
    - "correlation"
  dichotomous:
    - "pod"
    - "far"
    - "csi"
    - "ets"
    - "frequency_bias"
  spatial:
    - "fss"
  probabilistic:
    - "brier_score"
    - "roc_auc"
    - "reliability"

regions:
  - id: "west_coast"
    name: "West Coast & Ghats"
    lat_range: [8.0, 20.0]
    lon_range: [72.0, 77.0]
  - id: "central_india"
    name: "Central India (Monsoon Core)"
    lat_range: [18.0, 26.0]
    lon_range: [75.0, 85.0]
  - id: "northwest"
    name: "Northwest India"
    lat_range: [25.0, 36.0]
    lon_range: [70.0, 80.0]
  - id: "northeast"
    name: "Northeast India"
    lat_range: [22.0, 30.0]
    lon_range: [88.0, 97.0]
  - id: "south_peninsula"
    name: "South Peninsula"
    lat_range: [8.0, 16.0]
    lon_range: [75.0, 82.0]

bootstrap:
  n_resamples: 300
  confidence_level: 0.95
  random_state: 42
